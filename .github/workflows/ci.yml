name: BioQL Ecosystem CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.0

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: [pre-commit]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy isort bandit safety

      - name: Run black
        run: black --check --diff .
        continue-on-error: true

      - name: Run flake8
        run: flake8 --max-line-length=100 --exclude=venv,env,.venv
        continue-on-error: true

      - name: Run isort
        run: isort --check-only --profile black .
        continue-on-error: true

      - name: Run mypy type checking
        run: mypy Spectrix_framework Quillow QPHAROS --ignore-missing-imports
        continue-on-error: true

      - name: Run bandit security scan
        run: |
          bandit -r Spectrix_framework Quillow QPHAROS -f json -o bandit-report.json
        continue-on-error: true

      - name: Run safety dependency check
        run: |
          safety check --json
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenbabel-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests
        run: |
          pytest tests/unit -v -m "not slow" --cov --cov-report=xml --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

  build-packages:
    name: Build Python Packages
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build BioQL Framework
        run: |
          cd Spectrix_framework
          python -m build

      - name: Build Quillow
        run: |
          cd Quillow
          python -m build

      - name: Build QPHAROS
        run: |
          cd QPHAROS
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: python-packages
          path: |
            Spectrix_framework/dist/
            Quillow/dist/
            QPHAROS/dist/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Safety check
        run: |
          pip install safety
          safety check --json || true
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run integration tests
        run: |
          pytest tests/integration -v -m "not requires_ibm" --cov --cov-report=xml --cov-append
        continue-on-error: true

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: integration
          name: codecov-integration
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true
