<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioQL Quantum Graphs - Login</title>
    <style>
        :root {
            --color-bg-primary: #0A0E27;
            --color-bg-secondary: #1A1F3A;
            --color-bg-card: #151932;
            --color-accent-purple: #8B5CF6;
            --color-accent-cyan: #00D4FF;
            --color-text-primary: #FFFFFF;
            --color-text-secondary: #A0AEC0;
            --radius-xl: 1rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, var(--color-bg-primary) 0%, var(--color-bg-secondary) 100%);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .quantum-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0.3;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(139, 92, 246, 0.8), transparent),
                radial-gradient(2px 2px at 60% 70%, rgba(0, 212, 255, 0.8), transparent),
                radial-gradient(1px 1px at 50% 50%, rgba(139, 92, 246, 0.6), transparent);
            background-size: 200px 200px, 300px 300px, 150px 150px;
            animation: particleFloat 20s linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-30px) translateX(20px); }
            100% { transform: translateY(0) translateX(0); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            background: var(--color-bg-card);
            padding: 3rem;
            border-radius: var(--radius-xl);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 100px rgba(139, 92, 246, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--color-accent-cyan) 0%, var(--color-accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--color-text-secondary);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text-primary);
            font-weight: 600;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--color-bg-secondary);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 0.5rem;
            color: var(--color-text-primary);
            font-size: 0.9375rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .form-group input::placeholder {
            color: var(--color-text-secondary);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--color-accent-cyan) 0%, var(--color-accent-purple) 100%);
            border: none;
            border-radius: 0.5rem;
            color: var(--color-text-primary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.6);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .info-box {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 0.5rem;
        }

        .info-box p {
            color: var(--color-text-secondary);
            font-size: 0.8125rem;
            line-height: 1.6;
        }

        .info-box a {
            color: var(--color-accent-cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .info-box a:hover {
            text-decoration: underline;
        }

        .error-message {
            display: none;
            margin-top: 1rem;
            padding: 0.875rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 0.5rem;
            color: #FCA5A5;
            font-size: 0.875rem;
        }

        .error-message.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="quantum-particles"></div>

    <div class="login-container">
        <div class="logo">
            <h1>⚛️ Quantum Graphs</h1>
            <p>Quantum-Enhanced Scientific Visualization</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="apiKey">BioQL API Key</label>
                <input
                    type="password"
                    id="apiKey"
                    name="apiKey"
                    placeholder="sk_bioql_xxxxxxxxxxxxxxxx"
                    required
                    autocomplete="off"
                >
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                Access Quantum Graphs
            </button>

            <div class="error-message" id="errorMessage"></div>
        </form>

        <div class="info-box">
            <p>
                Don't have a BioQL API key?
                <a href="https://api.bioql.bio/signup" target="_blank">Sign up here</a>
            </p>
            <p style="margin-top: 0.5rem;">
                Need help? <a href="https://spectrixrd.com/docs.html" target="_blank">View documentation</a>
            </p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const apiKeyInput = document.getElementById('apiKey');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) {
                showError('Please enter your BioQL API key');
                return;
            }

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = 'Verifying<span class="spinner"></span>';
            errorMessage.classList.remove('show');

            try {
                // Validate API key with BioQL auth server
                const response = await fetch('https://api.bioql.bio/auth/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({ api_key: apiKey })
                });

                const data = await response.json();

                if (response.ok && data.valid) {
                    // Store API key in sessionStorage
                    sessionStorage.setItem('bioql_api_key', apiKey);
                    sessionStorage.setItem('bioql_user', JSON.stringify(data.user || {}));

                    // Redirect to main interface
                    window.location.href = '/quantum-graph/index.html';
                } else {
                    showError(data.message || 'Invalid API key. Please check your credentials.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Access Quantum Graphs';
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please try again.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Access Quantum Graphs';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Check if already logged in
        if (sessionStorage.getItem('bioql_api_key')) {
            window.location.href = '/quantum-graph/index.html';
        }
    </script>
</body>
</html>
