<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0a0f14; --panel:#0d141c; --line:#1b2632; --line2:#243343;
  --ink:#eef3f8; --body:#b9c6d4; --muted:#7c8da1;
  --accent:#e9a032; --ok:#7ed08a; --bad:#e4574c; --note:#8b74f4; --cool:#5b8def;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);overflow:hidden;
     -webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:1fr minmax(360px,455px);grid-template-rows:auto 1fr auto;
     height:100%;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}

/* ── masthead ─────────────────────────────────────────────────────── */
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;padding:13px 22px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0c131b,#0a0f14)}
#title{font:600 17px/1.2 var(--serif);letter-spacing:-.008em}
#subject{font:400 11.5px/1 var(--mono);color:var(--muted);letter-spacing:.01em}
header .sp{flex:1}
header button{background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:6px;
  padding:5px 11px;font:500 11px var(--mono);cursor:pointer;letter-spacing:.04em;transition:.16s}
header button:hover{color:var(--ink);border-color:var(--accent)}

/* ── the stage owns its column; text never sits on the animation ──── */
#stage{position:relative;overflow:hidden;min-height:0;
  background:radial-gradient(120% 90% at 30% 20%,#121b25 0%,#0a0f14 62%)}
#stage canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
  font:500 10px/1.45 var(--mono);color:var(--ink);background:rgba(10,15,20,.86);
  border:1px solid var(--line2);border-radius:5px;padding:2.5px 7px;letter-spacing:.02em;
  backdrop-filter:blur(3px)}
.tag.reg{border-color:#2c3f52}
.tag.sig{border-color:#d0577f;color:#f3aec2}
/* a domain name sits on top of the thing it names, so it needs its own ground:
   transparent, it was unreadable over the coloured cells it labelled */
.tag.dom{border:0;border-bottom:2px solid;border-radius:0;padding:1px 4px 2px;
  background:rgba(8,12,17,.82);text-shadow:0 1px 2px rgba(0,0,0,.9)}

/* the ray-traced still: what the reader lands on, before the live model */
#poster{position:absolute;inset:0;margin:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;cursor:pointer;z-index:2;
  background:radial-gradient(120% 90% at 30% 20%,#121b25 0%,#0a0f14 62%);
  animation:posterIn .7s ease both}
#poster[hidden]{display:none}
#poster img{max-width:min(78%,760px);max-height:74%;object-fit:contain;
  filter:drop-shadow(0 18px 44px rgba(0,0,0,.6))}
#poster figcaption{font:400 10.5px var(--mono);color:var(--muted);letter-spacing:.06em;
  border:1px solid var(--line2);border-radius:6px;padding:4px 10px;background:rgba(10,15,20,.7)}
@keyframes posterIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

/* the value plate: a chapter whose subject is a block of the result shows that block,
   not a stand-in shape. Typography is the visual here, so it gets the whole stage. */
#plate{position:absolute;inset:0;z-index:1;overflow-y:auto;overscroll-behavior:contain;
  padding:34px 36px 92px;scrollbar-width:thin;scrollbar-color:#243343 transparent;
  animation:plateIn .5s cubic-bezier(.4,0,.2,1) both}
#plate[hidden]{display:none}
@keyframes plateIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.plate-hd{font:500 10px var(--mono);color:var(--accent);text-transform:uppercase;
  letter-spacing:.15em;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.plate-grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;
  overflow:hidden;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.plate-grid .pv{background:var(--panel);padding:13px 15px;min-width:0}
.plate-grid .pk{font:500 9.5px var(--mono);color:var(--muted);text-transform:uppercase;
  letter-spacing:.09em;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate-grid .pn{font:500 14px/1.4 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere}
/* nothing to draw is an answer, and it is written as one */
#plate.void-plate{display:flex;align-items:center;justify-content:center;padding:34px 40px 92px}
.void{max-width:46ch;text-align:center}
.void .vk{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.18em;
  margin-bottom:14px}
.void .vk::before,.void .vk::after{content:"";display:block;height:1px;background:var(--line);
  margin:0 auto 14px;width:64px}
.void .vk::after{margin:14px auto 0}
.void .vt{font:400 16px/1.62 var(--serif);color:var(--body)}
.void .vp{margin-top:14px;font:400 10.5px var(--mono);color:#5c6b7d;letter-spacing:.04em}

/* the data band: the chapter's own numbers, drawn to scale */
/* One line, always: wrapped, seven long names grew the band to a third of the stage
   and the drawing ran in behind it. */
#band{position:absolute;left:0;right:0;bottom:0;padding:11px 20px 13px;
  background:linear-gradient(180deg,rgba(10,15,20,0) 0%,rgba(10,15,20,.92) 38%);
  display:flex;gap:22px;align-items:flex-end;flex-wrap:nowrap;overflow:hidden;
  pointer-events:none}
#band .bar{flex:1 1 0;min-width:0;max-width:210px}
#band .bk{font:500 9.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.09em;
  margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#band .bv{font:500 13px var(--mono);color:var(--ink);margin-bottom:5px;font-variant-numeric:tabular-nums}
#band .bv small{color:var(--muted);font-size:10.5px;margin-left:2px}
#band .track{height:3px;background:#1b2632;border-radius:2px;overflow:hidden}
#band .fill{height:100%;border-radius:2px;background:var(--accent);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── the story column ─────────────────────────────────────────────── */
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);
  background:linear-gradient(180deg,#0d141c,#0b1117)}
.chapter{padding:20px 24px 14px;border-bottom:1px solid var(--line)}
#kicker{font:500 10px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.14em}
#ch-title{margin:7px 0 0;font:500 23px/1.22 var(--serif);letter-spacing:-.012em}
#ch-index{font:400 10.5px var(--mono);color:var(--muted);letter-spacing:.06em}
#beats{list-style:none;margin:0;padding:10px 14px 22px;overflow-y:auto;flex:1;min-height:0;
  scrollbar-width:thin;scrollbar-color:#243343 transparent}
.beat{position:relative;padding:12px 13px 12px 15px;border-radius:9px;cursor:pointer;
  border-left:2px solid transparent;transition:background .18s,color .18s,border-color .18s}
.beat:hover{background:#121b24}
.beat.on{background:#131d27;border-left-color:var(--accent)}
.beat .txt{font:400 14.5px/1.6 var(--sans);color:var(--body)}
.beat.on .txt{color:var(--ink)}
.beat .lab{display:none;font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.11em;
  margin-bottom:5px}
.beat.gap .lab,.beat.check .lab,.beat.note .lab{display:block}
.beat.gap{border-left-color:var(--bad)} .beat.gap .lab{color:var(--bad)}
.beat.check{border-left-color:var(--ok)} .beat.check .lab{color:var(--ok)}
.beat.note .lab{color:var(--note)}
.beat.note .txt{font-size:13.5px;color:var(--muted)}
.beat .tech{margin-top:6px;font:400 11.5px/1.5 var(--mono);color:var(--muted);
  letter-spacing:.005em;padding-left:9px;border-left:1px solid var(--line2)}
.beat.on .tech{color:#93a4b8;border-left-color:var(--accent)}
.beat .src{position:absolute;top:11px;right:11px;background:transparent;border:1px solid var(--line2);
  color:var(--muted);border-radius:4px;font:500 9.5px var(--mono);padding:1px 5px;cursor:help;opacity:0;
  transition:opacity .18s}
.beat:hover .src,.beat.on .src{opacity:1}

/* ── transport ────────────────────────────────────────────────────── */
footer{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:9px 22px;
  border-top:1px solid var(--line);flex-wrap:wrap;background:#0c131b}
footer>button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line2);background:transparent;
  color:var(--body);font:11px var(--mono);cursor:pointer;transition:.16s}
footer>button:hover{border-color:var(--accent);color:var(--ink)}
#nav{display:flex;gap:4px;flex-wrap:wrap}
#nav button{width:27px;height:27px;border-radius:6px;border:1px solid var(--line2);background:transparent;
  color:var(--muted);font:500 10.5px var(--mono);cursor:pointer;transition:.16s}
#nav button:hover{color:var(--ink);border-color:var(--line2)}
#nav button.on{background:var(--accent);border-color:var(--accent);color:#0a0f14;font-weight:600}
#nav button.gap{border-color:#4a2a28}
footer .sp{flex:1}
footer .meta{font:400 10px var(--mono);color:var(--muted);letter-spacing:.03em}
#prog{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0;transition:width .2s linear}

/* ── the data dialog ──────────────────────────────────────────────── */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:13px;
  max-width:min(900px,93vw);max-height:84vh;overflow:auto;padding:0}
dialog::backdrop{background:rgba(4,7,10,.72);backdrop-filter:blur(2px)}
dialog h3{margin:0;padding:16px 22px;border-bottom:1px solid var(--line);font:500 15px var(--serif)}
dialog .body{padding:16px 22px 24px}
dialog h4{margin:18px 0 8px;font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;
  letter-spacing:.12em}
#checks{list-style:none;margin:0;padding:0;font:400 12.5px/1.6 var(--sans)}
#checks li{padding:6px 0 6px 24px;position:relative;color:var(--body)}
#checks li::before{position:absolute;left:0;font:600 12px var(--mono)}
#checks li.ok::before{content:"✓";color:var(--ok)}
#checks li.bad::before{content:"✕";color:var(--bad)}
#checks li.bad{color:var(--ink)}
#verif{margin-top:16px;font:400 12.5px/1.6 var(--sans);color:var(--body)}
#verif .hd{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;
  letter-spacing:.12em;margin-bottom:7px}
#verif .no{color:var(--bad)}
#verif ul{margin:9px 0 0;padding-left:0;list-style:none}
#verif li{padding:7px 0 7px 12px;border-left:1px solid var(--line2);margin-bottom:7px}
#verif .snt{display:block;color:var(--ink);font-size:12.5px;line-height:1.55}
#verif .why{display:block;margin-top:3px;font:400 10.5px var(--mono);color:var(--muted)}
#verif .why em{color:var(--bad);font-style:normal}
table{width:100%;border-collapse:collapse;font:400 11px var(--mono)}
td{border-top:1px solid var(--line);padding:6px 9px;vertical-align:top;word-break:break-all;color:var(--body)}
td:first-child{color:var(--muted);white-space:nowrap;width:36%}
@media (max-width:980px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 48vh 1fr auto}
  aside{border-left:0;border-top:1px solid var(--line)}
  #ch-title{font-size:20px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="title"></span><span id="subject"></span><span class="sp"></span>
    <button id="lang">ES</button>
    <button id="data">data</button>
    <button id="dl">JSON</button>
  </header>
  <div id="stage">
    <div id="plate" hidden></div>
    <figure id="poster" hidden>
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <div id="band"></div>
  </div>
  <aside>
    <div class="chapter">
      <div id="kicker"></div>
      <h2 id="ch-title"></h2>
      <span id="ch-index"></span>
    </div>
    <ul id="beats"></ul>
  </aside>
  <footer>
    <button id="prev" title="previous chapter">◀</button>
    <button id="play" title="play">▶</button>
    <button id="next" title="next">▶|</button>
    <div id="nav"></div>
    <span class="sp"></span>
    <span class="meta" id="coverage"></span>
    <div id="prog"></div>
  </footer>
</div>

<dialog id="dlg">
  <h3 id="dlg-title">Everything in this run</h3>
  <div class="body">
    <h4 id="h-checks">Recomputed and checked</h4>
    <ul id="checks"></ul>
    <div id="verif"></div>
    <h4 id="h-annex">Values no chapter shows</h4>
    <table><tbody id="annex"></tbody></table>
  </div>
</dialog>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>window.__BIOQL_REPORT = JSON.parse(document.getElementById("payload").textContent);</script>
<script type="module">__APP__</script>
<script>
  const dlg = document.getElementById("dlg");
  document.getElementById("data").onclick = () => dlg.showModal();
  dlg.onclick = e => { if (e.target === dlg) dlg.close(); };
</script>
</body>
</html>
