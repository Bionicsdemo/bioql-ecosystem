<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioQL Lab Notebook</title>

    <!-- Monaco Editor -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/editor/editor.main.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Header */
        .top-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        #notebook-title {
            font-size: 18px;
            color: white;
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            min-width: 300px;
        }

        #notebook-title:focus {
            outline: none;
            background: rgba(255,255,255,0.2);
        }

        .header-right {
            display: flex;
            gap: 12px;
        }

        .header-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* Toolbar */
        .toolbar {
            background: #1a1f3a;
            padding: 12px 24px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #2a2f4a;
        }

        .toolbar-btn {
            background: #2a2f4a;
            color: #e0e0e0;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: #3a3f5a;
        }

        .toolbar-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .toolbar-btn.primary:hover {
            opacity: 0.9;
        }

        /* Main Content */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        #cells-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Notebook Cells */
        .notebook-cell {
            background: #1a1f3a;
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .notebook-cell:hover {
            border-color: #667eea;
        }

        .cell-header {
            background: #2a2f4a;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cell-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .cell-type-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .cell-index {
            color: #888;
            font-family: 'Monaco', monospace;
            font-size: 12px;
        }

        .cell-actions {
            display: flex;
            gap: 8px;
        }

        .cell-action-btn {
            background: #3a3f5a;
            color: #e0e0e0;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .cell-action-btn:hover {
            background: #4a4f6a;
        }

        .run-cell {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .delete-cell {
            background: #e74c3c;
        }

        .cell-editor {
            min-height: 150px;
            border-top: 1px solid #2a2f4a;
            border-bottom: 1px solid #2a2f4a;
        }

        .cell-output {
            padding: 16px;
            min-height: 40px;
            background: #0a0e27;
        }

        .cell-output:empty:before {
            content: 'No output';
            color: #555;
            font-style: italic;
        }

        .cell-output-success {
            color: #2ecc71;
        }

        .cell-output-error {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #e74c3c;
        }

        .cell-output-loading {
            color: #3498db;
            animation: pulse 1.5s infinite;
        }

        .cell-output-info {
            color: #3498db;
            background: rgba(52, 152, 219, 0.1);
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }

        .cell-output pre {
            background: #000;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            color: #2ecc71;
            font-family: 'Monaco', monospace;
            font-size: 13px;
        }

        .cell-add-buttons {
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            justify-content: center;
            background: #1a1f3a;
            border-top: 1px dashed #2a2f4a;
        }

        .add-cell-btn {
            background: #2a2f4a;
            color: #e0e0e0;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .add-cell-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0e27;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-left">
                <div class="logo">🧬 BioQL Lab Notebook</div>
                <input type="text" id="notebook-title" placeholder="Untitled Notebook">
            </div>
            <div class="header-right">
                <button class="header-btn" onclick="window.notebookManager && window.notebookManager.saveNotebook()">
                    💾 Save
                </button>
                <button class="header-btn" onclick="window.location.href='/login.html'">
                    🚪 Logout
                </button>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="toolbar-btn primary" onclick="window.notebookManager && window.notebookManager.addCell('code')">
                + Code Cell
            </button>
            <button class="toolbar-btn primary" onclick="window.notebookManager && window.notebookManager.addCell('markdown')">
                + Markdown Cell
            </button>
            <button class="toolbar-btn primary" onclick="window.notebookManager && window.notebookManager.addCell('bioql')">
                + BioQL Cell
            </button>
            <button class="toolbar-btn" onclick="window.location.href='notebook.html'">
                📝 New Notebook
            </button>
        </div>

        <!-- Main Content Area -->
        <div class="content-area">
            <div id="cells-container">
                <div class="empty-state">
                    <h2>Loading notebook...</h2>
                    <p>Please wait while we set up your workspace</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script>
        // Configure Monaco Editor
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            console.log('✅ Monaco Editor loaded');
        });
    </script>

    <!-- Notebook Manager -->
    <script src="/notebook-manager.js"></script>
</body>
</html>
