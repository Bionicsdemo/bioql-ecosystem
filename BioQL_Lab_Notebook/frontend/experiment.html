<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment Details - BioQL Lab Notebook</title>
    <link rel="stylesheet" href="../static/css/main.css">
    <link rel="stylesheet" href="../static/css/experiments.css">
    <link rel="stylesheet" href="../static/css/editor.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <a href="index.html" class="logo">BioQL Lab Notebook</a>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="saveExperimentBtn">Save</button>
                <button class="btn btn-secondary" id="exportBtn">Export</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="experiment-detail">
            <div class="experiment-header">
                <input type="text" id="experimentTitle" class="experiment-title-input" placeholder="Experiment Title">
                <div class="experiment-meta">
                    <span class="meta-item">
                        <label>Date:</label>
                        <input type="date" id="experimentDate" class="meta-input">
                    </span>
                    <span class="meta-item">
                        <label>Status:</label>
                        <select id="experimentStatus" class="meta-select">
                            <option value="planning">Planning</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                            <option value="on-hold">On Hold</option>
                        </select>
                    </span>
                    <span class="meta-item">
                        <label>Tags:</label>
                        <input type="text" id="experimentTags" class="meta-input" placeholder="Add tags...">
                    </span>
                </div>
            </div>

            <div class="experiment-body">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" data-tab="overview">Overview</button>
                    <button class="tab" data-tab="protocol">Protocol</button>
                    <button class="tab" data-tab="data">Data</button>
                    <button class="tab" data-tab="results">Results</button>
                    <button class="tab" data-tab="notes">Notes</button>
                </div>

                <!-- Tab Content -->
                <div class="tab-content active" id="overview">
                    <h3>Experiment Overview</h3>
                    <div class="form-group">
                        <label for="objective">Objective</label>
                        <textarea id="objective" rows="3" placeholder="What is the goal of this experiment?"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="hypothesis">Hypothesis</label>
                        <textarea id="hypothesis" rows="3" placeholder="What do you expect to happen?"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="materials">Materials</label>
                        <textarea id="materials" rows="5" placeholder="List all materials, reagents, and equipment..."></textarea>
                    </div>
                </div>

                <div class="tab-content" id="protocol">
                    <h3>Protocol Steps</h3>
                    <div id="protocolSteps">
                        <div class="protocol-step">
                            <div class="step-number">1</div>
                            <textarea class="step-description" placeholder="Describe this step..."></textarea>
                            <button class="btn-icon add-step">+</button>
                            <button class="btn-icon remove-step">-</button>
                        </div>
                    </div>
                    <button class="btn btn-secondary" id="addStepBtn">Add Step</button>
                </div>

                <div class="tab-content" id="data">
                    <h3>Experimental Data</h3>
                    <div class="data-section">
                        <button class="btn btn-secondary" id="addTableBtn">Add Table</button>
                        <button class="btn btn-secondary" id="uploadDataBtn">Upload Data</button>
                    </div>
                    <div id="dataContainer">
                        <!-- Data tables will be added here -->
                    </div>
                </div>

                <div class="tab-content" id="results">
                    <h3>Results & Analysis</h3>
                    <div class="form-group">
                        <label for="observations">Observations</label>
                        <textarea id="observations" rows="5" placeholder="Record your observations..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="analysis">Analysis</label>
                        <textarea id="analysis" rows="5" placeholder="Analyze your results..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="conclusions">Conclusions</label>
                        <textarea id="conclusions" rows="5" placeholder="What conclusions can you draw?"></textarea>
                    </div>
                </div>

                <div class="tab-content" id="notes">
                    <h3>Additional Notes</h3>
                    <textarea id="additionalNotes" rows="10" placeholder="Add any additional notes, troubleshooting, or observations..."></textarea>
                </div>
            </div>

            <!-- Attachments Section -->
            <div class="attachments-section">
                <h3>Attachments</h3>
                <div class="attachment-upload">
                    <input type="file" id="fileInput" multiple hidden>
                    <button class="btn btn-secondary" id="attachFileBtn">Attach Files</button>
                </div>
                <div id="attachmentsList" class="attachments-list">
                    <!-- Attachments will be listed here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/experiment-detail.js" type="module"></script>
    <script src="../js/api.js" type="module"></script>
</body>
</html>
