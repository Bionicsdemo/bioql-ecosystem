[pytest]
# Pytest Configuration for BioQL Test Suite
# ==========================================

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests src/backend/tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --maxfail=10
    --durations=10

# Markers
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for end-to-end workflows
    slow: Tests that take >1 minute to run
    requires_ibm: Tests that require IBM Quantum access
    requires_rdkit: Tests that require RDKit library
    quantum: Tests that execute quantum algorithms
    performance: Performance and load tests
    critical: Critical path tests
    timeout: Set test timeout in seconds (pytest-timeout)
    failover: High availability failover test
    network: Tests que consultan APIs externas reales (Ensembl, ClinVar, gnomAD)
    no_network: Tests deterministas que no tocan la red

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    */node_modules/*
    */dist/*
    */build/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

# Timeout settings
timeout = 7200
timeout_method = thread

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# Minimum pytest version
minversion = 7.0

# Parallel execution (optional)
# Uncomment to enable parallel test execution
# addopts = -n auto
