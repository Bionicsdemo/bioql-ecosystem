[pytest]
# BioQL Ecosystem - Pytest Configuration

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Tests that take more than 5 seconds
    quantum: Tests that require quantum backend
    requires_api: Tests that require live API connection
    requires_ibm: Tests that require IBM Quantum access
    requires_modal: Tests that require Modal API access
    requires_stripe: Tests that require Stripe API access
    requires_rdkit: Tests that require RDKit chemistry library
    requires_pdb: Tests that require PDB database access
    requires_external_api: Tests that require any external API
    mock_only: Tests that only use mocks (no external dependencies)

# Options
addopts =
    -ra
    --strict-markers
    --tb=short
    --cov=Spectrix_framework
    --cov=Quillow
    --cov=QPHAROS
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Minimum coverage requirement
[coverage:run]
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
