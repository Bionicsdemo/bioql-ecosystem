# Pre-commit hooks configuration for BioQL Ecosystem
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_language_version:
  python: python3.10

repos:
  # ============================================================================
  # Code Formatting
  # ============================================================================

  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        name: black (Python formatter)
        language_version: python3.10
        args: [--line-length=100]
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: isort (import sorter)
        args: [--profile=black, --line-length=100]
        stages: [pre-commit]

  # ============================================================================
  # Linting
  # ============================================================================

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8 (style checker)
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
        args:
          - --max-line-length=100
          - --extend-ignore=E203,W503,E501,D100,D101,D102,D103,D104,D105,D106,D107,D200,D201,D202,D204,D205,D208,D209,D210,D211,D212,D213,D214,D215,D300,D301,D400,D401,D402,D403,D404,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414,D415,D416,D417,F401,F541,E402,F811
          - --exclude=venv,env,.venv,.git,__pycache__,node_modules,docs,tests
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (type checker)
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-setuptools
        args: [--ignore-missing-imports, --no-implicit-optional]
        exclude: ^(tests|docs|BioQL_Lab_Notebook|Quantum_graph/backend|.*setup\.py)/
        stages: [pre-commit]

  # ============================================================================
  # Testing
  # ============================================================================

  # A hook that cannot fail is not a check, it is a delay with a green tick.
  # Both hooks here used to end in `|| true` with stderr sent to /dev/null, so
  # they ran for minutes and always passed. They also called bare `pytest`,
  # which resolves to the Homebrew interpreter -- the one CLAUDE.md warns has
  # no flask and no block2, so its failures are not regressions. And the
  # coverage hook measured --cov on Spectrix_framework, Quillow and QPHAROS:
  # three packages that do not exist in this repository.
  #
  # What replaces them: the INVARIANT GUARDS, on the backend's own interpreter,
  # allowed to fail. 34 tests, ~18s. The full suite is 1501 tests and ~10min,
  # which belongs in CI (.github/workflows/ci.yml already runs it) rather than
  # in front of every commit. The hook is named for what it actually runs.
  - repo: local
    hooks:
      - id: pytest-invariant-guards
        name: pytest (invariant guards -- not the full suite)
        entry: >-
          /Users/heinzjungbluth/.bioql/venv/bin/python -m pytest
          tests/unit/test_no_fabricated_stubs.py
          tests/unit/test_bioql_gates.py
          tests/unit/test_modal_compute_layer.py
          -q --no-header -p no:cacheprovider
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Security
  # ============================================================================

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: bandit (security linter)
        # The comma-separated values MUST be quoted. Unquoted, YAML split them
        # into separate list items, so bandit received `B601` and each exclude
        # path as stray positional arguments and exited with a usage error on
        # every run. It never scanned anything; nobody noticed, because the
        # hook had not executed since the pre-commit installation broke.
        args:
          - -r
          - .
          - -ll
          - -i
          - --skip
          - "B101,B601"
          - --exclude
          - "./tests,./venv,./env,./.venv,./docs,./Spectrix_framework/archives"
        pass_filenames: false
        stages: [pre-commit]

  # SECRETS. This is the gap that actually burned this repository: a TypeSafe
  # key in the history, security/api_keys.json found untracked-but-unignored in
  # the July 2026 audit, an API key shipped inside a .vsix. bandit lints for
  # insecure code and finds none of that; it never looks at a value.
  - repo: local
    hooks:
      - id: check-secrets
        name: secrets (block a live credential entering history)
        entry: /Users/heinzjungbluth/.bioql/venv/bin/python scripts/scan_credentials.py
        language: system
        types: [text]
        stages: [pre-commit]

  # `safety` was removed rather than repaired: it is not installed anywhere on
  # this machine, so `safety check || true` reported "Passed" on every commit
  # while checking nothing at all. A dependency-CVE scan is worth having -- via
  # pip-audit, which needs no account -- but it has to actually be installed
  # before it is worth a hook. CI is the right place for it.

  # ============================================================================
  # Git and File Checks
  # ============================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: check-yaml (validate YAML syntax)
        args: [--unsafe]

      - id: check-json
        name: check-json (validate JSON syntax)

      - id: trailing-whitespace
        name: trailing-whitespace (remove trailing spaces)
        args: [--markdown-linebreak-ext=md]

      - id: end-of-file-fixer
        name: end-of-file-fixer (ensure single newline at EOF)

      - id: check-merge-conflict
        name: check-merge-conflict (detect merge conflicts)

      - id: check-case-conflict
        name: check-case-conflict (detect case conflicts)

      - id: detect-private-key
        name: detect-private-key (block committed private keys)
      - id: mixed-line-ending
        name: mixed-line-ending (fix line endings)
        args: [--fix=lf]

  # ============================================================================
  # Documentation
  # ============================================================================
  # Note: check-docstring-is-first has been removed from pre-commit-hooks

# ============================================================================
# Configuration
# ============================================================================

# Exclude certain paths from all hooks
exclude: |
  (?x)^(
    venv|env|.venv|
    __pycache__|
    \.pytest_cache|
    \.git|
    node_modules|
    docs/releases|
    .*\.egg-info|
    \.mypy_cache
  )/

# Don't run on tags (e.g., release tags)
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [pytest-unit-tests, pytest-coverage-check, safety-check]
  submodules: false
